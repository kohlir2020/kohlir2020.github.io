title: "Raunit Kohli — ML Engineer & Researcher"   # used for <title> / SEO
brand: "Raunit Kohli"                               # short header label
description: "ML engineer at Rocket Software and UCSD research staff working on LLM systems, RL, and neurorobotics."
url: "https://www.raunitkohli.com"
baseurl: ""

author:
  name: "Raunit Kohli"
  email: "raunitkohli@gmail.com"
  url: "https://www.raunitkohli.com"

social:
  github: "kohlir2020"
  linkedin: "in/raunit-kohli"
  email: "raunitkohli@gmail.com"

nav:
  - title: "Home"
    url: "/"
  - title: "Industry"
    url: "/work/"
  - title: "Research"
    url: "/research/"
  - title: "Extracurricular"
    url: "/extracurricular/"
  - title: "Resume"
    url: "/resume/"

lang: en_US
timezone: America/New_York

# Optional: pretty URLs and basic plugins GitHub Pages supports
permalink: pretty
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-redirect-from

# Exclude non-page files from Jekyll processing
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - _config_local.yml
  - assets/linkedin_draft.md
  - assets/reference_notes.md
  - assets/old
  - assets/rk_resume.tex
  - assets/rk_cv.tex

defaults:
  - scope: { path: "" }
    values: { layout: default }
  # Keep PDFs out of the XML sitemap (they are surfaced via the /resume/ page)
  - scope: { path: "assets" }
    values: { sitemap: false }